experiment:
  num_clients: 10
  clients_per_round: 5
  num_rounds: 20
  local_epochs: 3
  learning_rate: 0.01

dataset:
  mnist_target_accuracy: 85.0      # % — threshold for A2 metric
  cifar10_target_accuracy: 70.0    # % — threshold for A2 metric

# NOTE: these two sections are documentation of the defaults hardcoded in
# src/strategies/*.py — they are not currently loaded from this file at
# runtime (run_single.py / run_batch.py configure strategies via CLI args
# and in-code defaults). Kept here so the config stays a faithful reference
# alongside the paper each strategy implements.

performance_strategy:               # Oort (statistical utility + bandit)
  exploration_factor_init: 0.9      # initial epsilon
  exploration_decay: 0.98           # multiplicative decay per round while eps > floor
  exploration_floor: 0.2            # epsilon stops decaying below this
  loss_history_window: 10           # rolling window size for loss_rms
  utility_clip_percentile: 95       # outlier-robustness utility cap
  cutoff_confidence: 0.95           # c: exploitation candidate-pool sizing

fairness_strategy:                  # FairFedCS (reputation + virtual queue)
  sigma: 0.6                        # CSI trade-off: sigma*r_i + Q_i
  reputation_prior_a: 1             # Beta(1,1) prior -> r_i = 0.5
  reputation_prior_b: 1
  shapley_method: exact             # exact enumeration of 2^m coalition subsets

logging:
  level: INFO
  trace_mode: false                # set true for shape/tensor debug output
  log_dir: logs/

paths:
  data_dir: data/raw/
  partition_dir: data/partitions/
  results_dir: results/

grid:
  strategies:
    - random
    - performance
    - fairness
  alphas:
    - 0.1
    - 0.5
    - 1.0
  seeds:
    - 42
    - 123
    - 456
  datasets:
    - mnist
    - cifar10
